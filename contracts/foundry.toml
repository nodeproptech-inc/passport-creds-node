[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# DeployPassportKit.s.sol writes deployments/<chainid>.json (addresses + startBlock for the subgraph/.env)
fs_permissions = [{ access = "write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
